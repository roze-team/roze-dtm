<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Roze DTM Control Plane</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #fff;
      --panel-strong: #f8fafc;
      --line: #e3e9f1;
      --line-strong: #cfd9e8;
      --text: #172033;
      --muted: #667085;
      --accent: #4e88f3;
      --accent-2: #0796d4;
      --warn: #c47a0b;
      --danger: #dc5e67;
      --success: #1b9d68;
      --shadow: 0 1px 2px rgb(15 23 42 / 2.5%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 100% 0%, rgba(14, 165, 233, .035), transparent 28rem), var(--bg);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    .shell { display: grid; gap: 18px; width: min(1680px, calc(100% - 36px)); margin: 0 auto; padding: 18px 0 36px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 76px; padding: 16px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); }
    .brand { display: flex; gap: 14px; align-items: center; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid #d9e6fb; border-radius: 10px; color: var(--accent); background: #edf3fe; }
    .mark svg { width: 24px; height: 24px; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
    .subtitle { color: var(--muted); margin-top: 3px; font-size: 13px; }
    .connection { display: flex; gap: 8px; align-items: center; }
    input, select, button { border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--panel); }
    input, select { min-height: 38px; padding: 8px 11px; outline: none; }
    input:focus, select:focus { border-color: #75a5fb; box-shadow: 0 0 0 3px rgba(78, 136, 243, .1); }
    button { min-height: 38px; padding: 8px 14px; cursor: pointer; font-weight: 650; }
    button:hover { border-color: #a8c8fa; color: #3378eb; background: #f3f7ff; }
    button.primary { color: #fff; border-color: #0786c7; background: linear-gradient(105deg, #0877b8, #0796d4); box-shadow: 0 5px 14px rgba(7, 134, 199, .18); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #token { width: min(310px, 34vw); }
    .status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a7b2c2; box-shadow: 0 0 0 4px rgb(167 178 194 / 10%); }
    .dot.ok { background: #22c55e; box-shadow: 0 0 0 4px rgb(34 197 94 / 10%); }
    .dot.error { background: var(--danger); box-shadow: 0 0 0 4px rgb(220 94 103 / 10%); }
    .cards { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card, .panel { border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
    .card { position: relative; display: grid; min-width: 0; grid-template-columns: 42px minmax(0, 1fr); column-gap: 12px; padding: 16px; border-radius: 10px; transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease; }
    .card:hover { border-color: var(--line-strong); box-shadow: 0 8px 22px rgb(15 23 42 / 6%); transform: translateY(-1px); }
    .metric-icon { display: grid; width: 42px; height: 42px; grid-row: 1 / 3; place-items: center; border-radius: 10px; color: #4e88f3; background: #edf3fe; font-size: 17px; font-weight: 700; }
    .metric-icon.green { color: #1b9d68; background: #eaf8f2; }
    .metric-icon.orange { color: #ed8b2c; background: #fff4e8; }
    .metric-icon.violet { color: #7c5ce7; background: #f1edff; }
    .metric-icon.rose { color: #dc5e83; background: #fff0f4; }
    .card .label { align-self: end; color: var(--muted); font-size: 12px; }
    .card .value { align-self: start; margin-top: 2px; font-size: 19px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .panel { padding: 16px; border-radius: 10px; overflow: hidden; }
    .toolbar { display: grid; grid-template-columns: minmax(180px, 1.4fr) repeat(2, minmax(130px, .7fr)) auto; gap: 10px; padding: 13px 14px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-strong); }
    .table-wrap { overflow: auto; min-height: 360px; }
    table { width: 100%; border-collapse: collapse; min-width: 1050px; }
    th, td { padding: 10px 12px; height: 44px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { position: sticky; top: 0; z-index: 1; height: 42px; color: #475569; background: linear-gradient(180deg, #fafbfd, var(--panel-strong)); font-size: 12px; font-weight: 600; }
    td { font-variant-numeric: tabular-nums; }
    td.gid { max-width: 270px; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: #d8ebe5; }
    tbody tr:hover { background: #f7faff; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; border: 1px solid #dce5ee; color: #4e6f9f; background: #f2f6fc; font-size: 12px; font-weight: 500; }
    .badge.succeeded { color: var(--success); border-color: #ccebdd; background: #eaf8f2; }
    .badge.failed, .badge.aborted { color: var(--danger); border-color: #f0d1d7; background: #fff0f4; }
    .badge.aborting, .badge.prepared { color: var(--warn); border-color: #f1dfb8; background: #fff6df; }
    .progress { width: 94px; height: 6px; overflow: hidden; border-radius: 999px; background: #e9eef5; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #75a5fb, #4e88f3); }
    .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; color: var(--muted); }
    .pager-actions { display: flex; gap: 8px; }
    .empty { display: grid; place-items: center; min-height: 300px; color: var(--muted); text-align: center; }
    .error-banner { display: none; padding: 11px 13px; border: 1px solid #f0d1d7; border-radius: 8px; color: #b63d4c; background: #fff5f6; }
    .error-banner.visible { display: block; }
    footer { margin-top: 12px; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    @media (max-width: 980px) { .cards { grid-template-columns: repeat(3, 1fr); } header { flex-direction: column; } .connection { width: 100%; } #token { flex: 1; width: auto; } }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #0f131a; --panel: #171c24; --panel-strong: #1d2430; --line: #2a3342; --line-strong: #3b4759; --text: #eef2f8; --muted: #9aa8bb; --shadow: none; }
      body { background: var(--bg); }
      th { color: #aeb9c9; background: var(--panel-strong); }
      tbody tr:hover { background: #1d2430; }
      input, select, button { background: #171c24; }
      button:hover { background: #1d2a3a; }
      .badge { border-color: #354256; color: #a9c5ef; background: #202b3a; }
      .metric-icon { background: #202c42; }
    }
    @media (max-width: 680px) { .shell { width: min(100% - 20px, 1680px); padding-top: 10px; } .cards { grid-template-columns: repeat(2, 1fr); } .toolbar { grid-template-columns: 1fr 1fr; } .toolbar input { grid-column: 1 / -1; } footer { flex-direction: column; gap: 4px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6.5 12 3l7 3.5v7L12 21l-7-3.5v-11Z"/><path d="m5 6.5 7 4 7-4M12 10.5V21"/></svg>
        </div>
        <div><h1>Roze DTM Control Plane</h1><div class="subtitle">只读事务态势 · 载荷与分支地址已脱敏</div></div>
      </div>
      <div>
        <div class="connection">
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Bearer control token" aria-label="Control token">
          <button id="connect" class="primary" type="button">连接</button>
        </div>
        <div class="status-line"><span id="dot" class="dot"></span><span id="connection-text">等待连接</span></div>
      </div>
    </header>

    <div id="error" class="error-banner" role="alert"></div>
    <section class="cards" aria-label="事务摘要">
      <article class="card"><div class="metric-icon">Σ</div><div class="label">全部事务</div><div id="total" class="value">—</div></article>
      <article class="card"><div class="metric-icon violet">↻</div><div class="label">进行中</div><div id="active" class="value">—</div></article>
      <article class="card"><div class="metric-icon green">✓</div><div class="label">已成功</div><div id="succeeded" class="value">—</div></article>
      <article class="card"><div class="metric-icon orange">↩</div><div class="label">已中止</div><div id="aborted" class="value">—</div></article>
      <article class="card"><div class="metric-icon rose">!</div><div class="label">失败</div><div id="failed" class="value">—</div></article>
      <article class="card"><div class="metric-icon orange">⏱</div><div class="label">等待重试</div><div id="retry_scheduled" class="value">—</div></article>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input id="gid" type="search" maxlength="128" placeholder="按 GID 精确查询" aria-label="GID">
        <select id="kind" aria-label="事务类型"><option value="">全部类型</option><option>tcc</option><option>saga</option><option>workflow</option><option>message</option><option>xa</option></select>
        <select id="status" aria-label="事务状态"><option value="">全部状态</option><option>submitted</option><option>trying</option><option>prepared</option><option>succeeding</option><option>succeeded</option><option>aborting</option><option>aborted</option><option>failed</option></select>
        <button id="refresh" type="button">刷新</button>
      </div>
      <div id="table-wrap" class="table-wrap">
        <table>
          <thead><tr><th>GID</th><th>类型</th><th>状态</th><th>分支进度</th><th>失败分支</th><th>尝试</th><th>下次重试</th><th>更新时间</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty">输入控制令牌后连接</div>
      </div>
      <div class="pager">
        <span id="page-text">尚未加载</span>
        <div class="pager-actions"><button id="previous" type="button" disabled>上一页</button><button id="next" type="button" disabled>下一页</button></div>
      </div>
    </section>
    <footer><span>数据接口：/v1/dashboard · 只读</span><span id="generated">—</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const state = { offset: 0, limit: 50, total: 0, loading: false };
      const number = new Intl.NumberFormat('zh-CN');
      const date = new Intl.DateTimeFormat('zh-CN', { dateStyle: 'short', timeStyle: 'medium' });

      function setText(id, value) { $(id).textContent = value; }
      function showError(message) { $('error').textContent = message; $('error').classList.toggle('visible', Boolean(message)); }
      function setConnection(kind, text) { $('dot').className = `dot ${kind || ''}`; setText('connection-text', text); }
      function formatTime(value) { return value ? date.format(new Date(value)) : '—'; }

      function cell(text, className) {
        const node = document.createElement('td');
        node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      function renderRow(item) {
        const row = document.createElement('tr');
        const gid = cell(item.gid, 'gid');
        gid.title = item.gid;
        row.append(gid, cell(item.kind));
        const status = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `badge ${item.status}`;
        badge.textContent = item.status;
        status.append(badge);
        row.append(status);
        const progressCell = document.createElement('td');
        const progress = document.createElement('div');
        progress.className = 'progress';
        const bar = document.createElement('span');
        const ratio = item.branch_count ? item.completed_branch_count / item.branch_count : (item.terminal ? 1 : 0);
        bar.style.width = `${Math.max(0, Math.min(100, ratio * 100))}%`;
        progress.append(bar);
        progress.title = `${item.completed_branch_count}/${item.branch_count}`;
        progressCell.append(progress);
        row.append(progressCell, cell(number.format(item.failed_branch_count)), cell(number.format(item.total_attempts)), cell(formatTime(item.next_retry_millis)), cell(formatTime(item.updated_at_millis)));
        return row;
      }

      function render(snapshot) {
        for (const key of ['total', 'active', 'succeeded', 'aborted', 'failed', 'retry_scheduled']) setText(key, number.format(snapshot.summary[key]));
        const page = snapshot.transactions;
        state.total = page.total;
        state.offset = page.offset;
        $('rows').replaceChildren(...page.items.map(renderRow));
        $('empty').style.display = page.items.length ? 'none' : 'grid';
        if (!page.items.length) $('empty').textContent = '没有符合条件的事务';
        const first = page.total ? page.offset + 1 : 0;
        const last = Math.min(page.offset + page.limit, page.total);
        setText('page-text', `${number.format(first)}–${number.format(last)} / ${number.format(page.total)}`);
        $('previous').disabled = page.offset === 0;
        $('next').disabled = page.offset + page.limit >= page.total;
        setText('generated', `快照 ${formatTime(snapshot.generated_at_millis)}`);
      }

      async function load() {
        if (state.loading) return;
        state.loading = true;
        $('refresh').disabled = true;
        showError('');
        setConnection('', '正在读取');
        try {
          const params = new URLSearchParams({ offset: String(state.offset), limit: String(state.limit) });
          for (const id of ['gid', 'kind', 'status']) if ($(id).value.trim()) params.set(id, $(id).value.trim());
          const headers = { Accept: 'application/json' };
          const token = $('token').value;
          if (token) headers.Authorization = `Bearer ${token}`;
          const response = await fetch(`/v1/dashboard?${params}`, { headers, cache: 'no-store', credentials: 'same-origin' });
          const envelope = await response.json().catch(() => null);
          if (!response.ok || !envelope || envelope.code !== 0) throw new Error(response.status === 401 ? '控制令牌无效' : (envelope && envelope.message) || `请求失败 (${response.status})`);
          render(envelope.data);
          setConnection('ok', '已连接');
        } catch (error) {
          setConnection('error', '连接失败');
          showError(error instanceof Error ? error.message : '无法读取 Dashboard');
        } finally {
          state.loading = false;
          $('refresh').disabled = false;
        }
      }

      $('connect').addEventListener('click', () => { state.offset = 0; load(); });
      $('refresh').addEventListener('click', () => { state.offset = 0; load(); });
      $('token').addEventListener('keydown', (event) => { if (event.key === 'Enter') { state.offset = 0; load(); } });
      for (const id of ['kind', 'status']) $(id).addEventListener('change', () => { state.offset = 0; load(); });
      $('gid').addEventListener('keydown', (event) => { if (event.key === 'Enter') { state.offset = 0; load(); } });
      $('previous').addEventListener('click', () => { state.offset = Math.max(0, state.offset - state.limit); load(); });
      $('next').addEventListener('click', () => { if (state.offset + state.limit < state.total) { state.offset += state.limit; load(); } });
    })();
  </script>
</body>
</html>
