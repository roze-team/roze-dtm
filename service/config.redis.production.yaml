name: roze-dtm
profile: production

logging:
  enabled: true
  level: info
  format: json
  stdout: true
  ansi: false
  target: true
  span_events: none
  utc_time: true
  non_blocking_buffer: 8192
  lossy: false

rest:
  addr: 0.0.0.0:8090
  register: false

rpc:
  addr: 0.0.0.0:36790

governance: {}

application:
  dtm:
    control_token: env://ROZE_DTM_CONTROL_TOKEN
    release_revision: env://ROZE_DTM_RELEASE_REVISION
    recover_interval_ms: 1000
    recovery_lease_ttl_ms: 5000
    data_expire_seconds: 604800
    finished_data_expire_seconds: 86400
    retention_interval_ms: 60000
    retention_batch_size: 256
    worker_id: env://ROZE_DTM_WORKER_ID
    allowed_branch_origins:
      - http://inventory:8080
      - http://account:8080
    # branch_tls_ca_file: /run/secrets/roze-dtm-branch-ca.pem
    store:
      kind: redis
      redis_url: env://ROZE_DTM_REDIS_URL
      redis_namespace: roze-dtm-production
      redis_operation_timeout_ms: 5000
    max_attempts: 5
    retry_backoff_ms: 1000
    max_retry_backoff_ms: 30000
    branch_call_timeout_ms: 5000
    transaction_timeout_ms: 60000
    # alert_webhook_url: env://ROZE_DTM_ALERT_WEBHOOK_URL
    alert_retry_limit: 3
    alert_webhook_timeout_ms: 3000
