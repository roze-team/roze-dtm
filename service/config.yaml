name: roze-dtm
profile: development

logging:
  enabled: true
  level: info
  format: json
  stdout: true
  ansi: false
  target: true
  span_events: none
  utc_time: true
  non_blocking_buffer: 8192
  lossy: true

rest:
  addr: 127.0.0.1:8090
  register: false

rpc:
  addr: 127.0.0.1:36790

governance: {}

application:
  dtm:
    # Production requires release_revision: env://ROZE_DTM_RELEASE_REVISION.
    recover_interval_ms: 1000
    recovery_lease_ttl_ms: 5000
    worker_id: roze-dtm-local
    # Exact HTTP(S) origins only; paths, wildcards, credentials, and redirects are rejected.
    allowed_branch_origins:
      - http://inventory
      - http://account
    store:
      kind: memory
      max_connections: 10
      # Production example:
      # kind: postgres
      # database_url: env://ROZE_DTM_DATABASE_URL
      # Redis standalone/Cluster example:
      # kind: redis
      # redis_url: env://ROZE_DTM_REDIS_URL
      # redis_cluster_urls:
      #   - rediss://redis-0:6379
      #   - rediss://redis-1:6379
      # redis_namespace: roze-dtm-development
      # redis_operation_timeout_ms: 5000
    max_attempts: 5
    retry_backoff_ms: 1000
    max_retry_backoff_ms: 30000
    branch_call_timeout_ms: 5000
    transaction_timeout_ms: 60000
