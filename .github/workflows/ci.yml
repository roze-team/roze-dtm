name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roze_dtm
          POSTGRES_USER: roze
          POSTGRES_PASSWORD: roze-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roze -d roze_dtm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: roze_dtm
          MYSQL_USER: roze
          MYSQL_PASSWORD: roze-test
          MYSQL_ROOT_PASSWORD: root-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROZE_DTM_TEST_POSTGRES_URL: postgres://roze:roze-test@127.0.0.1:5432/roze_dtm
      ROZE_DTM_TEST_MYSQL_URL: mysql://roze:roze-test@127.0.0.1:3306/roze_dtm
      ROZE_TEST_REDIS_URL: redis://127.0.0.1:6379
      ROZE_TEST_REDIS_CLUSTER_URLS: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-deny
      - name: Enable PostgreSQL prepared transactions
        run: |
          container_id="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          test -n "$container_id"
          docker exec "$container_id" psql -U roze -d roze_dtm -c "ALTER SYSTEM SET max_prepared_transactions = 100"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U roze -d roze_dtm; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Grant MySQL XA recovery privilege
        run: |
          container_id="$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}')"
          test -n "$container_id"
          docker exec "$container_id" mysql -uroot -proot-test \
            -e "GRANT XA_RECOVER_ADMIN ON *.* TO 'roze'@'%';"
      - name: Start Redis Cluster
        run: |
          for port in 7000 7001 7002; do
            docker run --detach --name "roze-dtm-redis-$port" --network host redis:7.4 \
              redis-server --port "$port" --cluster-enabled yes \
              --cluster-config-file nodes.conf --cluster-node-timeout 5000 \
              --appendonly no --protected-mode no
          done
          for attempt in $(seq 1 30); do
            if docker run --rm --network host redis:7.4 redis-cli -p 7000 ping | grep -q PONG; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          docker run --rm --network host redis:7.4 redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            --cluster-replicas 0 --cluster-yes
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Dependency policy
        run: cargo deny check
      - name: Test
        run: cargo test --workspace
      - name: Redis integration
        run: cargo test -p roze-dtm redis_store_round_trip_against_real_service -- --ignored --nocapture
      - name: Redis Cluster integration
        run: cargo test -p roze-dtm redis_cluster_store_round_trip_against_real_service -- --ignored --nocapture
